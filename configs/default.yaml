data:
  dataset: "cic-ids-2018"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  window_size: 60          # seconds
  slide_size: 30           # seconds
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

features:
  flow_level:
    - "Dst Port"
    - "Protocol"
    - "Flow Duration"
    - "Total Fwd Packets"
    - "Total Bwd Packets"
    - "Total Length of Fwd Packets"
    - "Total Length of Bwd Packets"
    - "Fwd Packet Length Max"
    - "Fwd Packet Length Min"
    - "Fwd Packet Length Mean"
    - "Fwd Packet Length Std"
    - "Bwd Packet Length Max"
    - "Bwd Packet Length Min"
    - "Bwd Packet Length Mean"
    - "Bwd Packet Length Std"
    - "Flow Bytes/s"
    - "Flow Packets/s"
    - "Flow IAT Mean"
    - "Flow IAT Std"
    - "Flow IAT Max"
    - "Flow IAT Min"
    - "Fwd IAT Mean"
    - "Fwd IAT Std"
    - "Fwd IAT Max"
    - "Fwd IAT Min"
    - "Bwd IAT Mean"
    - "Bwd IAT Std"
    - "Bwd IAT Max"
    - "Bwd IAT Min"
    - "Fwd PSH Flags"
    - "Bwd PSH Flags"
    - "Fwd URG Flags"
    - "Bwd URG Flags"
    - "Fwd Header Length"
    - "Bwd Header Length"
    - "Fwd Packets/s"
    - "Bwd Packets/s"
    - "Min Packet Length"
    - "Max Packet Length"
    - "Packet Length Mean"
    - "Packet Length Std"
    - "Packet Length Variance"
    - "SYN Flag Count"
    - "ACK Flag Count"
    - "RST Flag Count"
    - "FIN Flag Count"
    - "CWE Flag Count"
    - "ECE Flag Count"
    - "Down/Up Ratio"
    - "Average Packet Size"
    - "Avg Fwd Segment Size"
    - "Avg Bwd Segment Size"
    - "Init_Win_bytes_forward"
    - "Init_Win_bytes_backward"
    - "act_data_pkt_fwd"
    - "min_seg_size_forward"
  packet_level:
    - "ttl_variance"
    - "tcp_window_size"
    - "ip_fragment_flags"
    - "payload_size"

attack_stages:
  - "Benign"
  - "Reconnaissance"
  - "Initial Access"
  - "Lateral Movement"
  - "Command and Control"
  - "Exfiltration"

model:
  type: "lstm"             # lstm | transformer | gru
  hidden_size: 128
  num_layers: 2
  dropout: 0.2
  num_heads: 8             # only for transformer
  d_model: 128             # only for transformer

training:
  batch_size: 64
  learning_rate: 0.001
  epochs: 50
  patience: 10             # early stopping
  device: "auto"           # auto | cpu | cuda

prediction:
  k_steps: 5               # forecast horizon
  confidence_threshold: 0.5

explainability:
  method: "shap"           # shap | attention | grad_cam
  num_samples: 100

demo:
  port: 8501
  host: "0.0.0.0"
